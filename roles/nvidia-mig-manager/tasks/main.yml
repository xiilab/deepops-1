---
# Install the NVIDIA MIG Manager tooling on all MIG-capable nodes

# Check node state. nvidia-smi runs in a transient unit so the probe also works
# on nodes where the Slurm login setup hides GPUs from ssh sessions, and only a
# real MIG mode counts: with hidden GPUs nvidia-smi prints "No devices were
# found", which 'grep -v N/A' would accept as a match.
- name: check for MIG capable devices
  shell: >-
    set -o pipefail &&
    systemd-run --wait --pipe --collect --quiet
    nvidia-smi --query-gpu=mig.mode.current --format=csv,noheader
    | grep -E '^(Enabled|Disabled)$'
  args:
    executable: "/bin/bash"
  become: true
  register: has_mig
  failed_when: false
  changed_when: false

- name: check for NVIDIA MIG parted
  shell: which nvidia-mig-parted  # noqa command-instead-of-shell
  register: has_mig_parted
  failed_when: false
  changed_when: false

# Install NVIDIA MIG Manager Systemd service
- name: Install MIG Manager (apt)
  apt:
    deb: "{{ mig_manager_url_deb }}"
  when:
    - has_mig.rc == 0
    - has_mig_parted.rc != 0
    - ansible_os_family == "Debian"
- name: Install MIG Manager (yum)
  yum:
    name: "{{ mig_manager_url_rpm }}"
    state: present
  when:
    - has_mig_parted.rc != 0
    - ansible_os_family == "RedHat"
